<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTZ · Ordens de Serviço &amp; Orçamentos</title>
<style>
  :root{
    --navy:#1F3864; --navy-2:#16294a; --blue:#1F6FD6; --blue-light:#3DA5FF;
    --bg:#F4F7FB; --card:#FFFFFF; --border:#E1E7F0; --text:#1D2733; --muted:#6B7686;
    --light:#E8EEF7; --danger:#D64545; --ok:#1E9E5A; --warn:#C98A12;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B0F16; --card:#131A24; --border:#232E3D; --text:#E7ECF3; --muted:#8C99AC; --light:#182234;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B0F16; --card:#131A24; --border:#232E3D; --text:#E7ECF3; --muted:#8C99AC; --light:#182234;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;}
  .wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px;}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  header.top img{height:54px;}
  nav.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px;}
  nav.tabs button{border:none;background:transparent;color:var(--muted);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;}
  nav.tabs button.active{background:var(--navy);color:#fff;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;}
  h2{margin:0 0 14px;font-size:18px;color:var(--navy-2);}
  :root[data-theme="dark"] h2, .dark h2{color:#DCE6F5;}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px;}
  input[type=text],input[type=tel],input[type=date],input[type=number],textarea,select{
    width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14.5px;font-family:inherit;
  }
  textarea{resize:vertical;min-height:60px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .rowEnd{display:grid;grid-template-columns:3fr 1fr;gap:12px;}
  .rowCid{display:grid;grid-template-columns:2fr 2fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;align-items:end;}
  @media (max-width:640px){.row,.row3{grid-template-columns:1fr;}}
  .itens-list{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:6px;}
  .item-row{display:grid;grid-template-columns:1fr 120px 40px;gap:8px;padding:8px;border-bottom:1px solid var(--border);align-items:center;}
  .item-row:last-child{border-bottom:none;}
  .item-row input{margin:0;}
  .btn{border:none;border-radius:8px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn-sm{padding:6px 10px;font-size:12.5px;}
  .icon-btn{background:transparent;border:none;color:var(--danger);font-size:18px;cursor:pointer;line-height:1;}
  .total-box{margin-top:12px;background:var(--navy);color:#fff;border-radius:10px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700;}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  table.hist{width:100%;border-collapse:collapse;font-size:14px;}
  table.hist th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);}
  table.hist td{padding:10px;border-bottom:1px solid var(--border);}
  table.hist tr:hover{background:var(--light);cursor:pointer;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge-orc{background:#FCEFC7;color:#8A6100;}
  .badge-aprov{background:#D9EAFD;color:#1A5DAA;}
  .badge-concl{background:#DCF3E4;color:#177A45;}
  .badge-recus{background:#FBDCDC;color:#A32E2E;}
  .search{margin-bottom:12px;}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:50;}
  .modal{background:var(--card);border-radius:14px;max-width:760px;width:100%;padding:0;overflow:hidden;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);}
  .modal-body{padding:0;}
  .close-x{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;}
  .doc{background:#fff;color:#1D2733;padding:34px 30px;}
  .doc-header{text-align:center;margin-bottom:14px;}
  .doc-header img{height:60px;}
  .doc hr{border:none;border-top:2px solid var(--navy);margin:14px 0 18px;}
  .doc h3{text-align:center;color:var(--navy);margin:0 0 16px;font-size:19px;}
  .doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid #ccc;border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:13px;}
  .doc-grid b{display:block;font-size:11px;color:#555;text-transform:uppercase;}
  .doc-section-title{color:var(--navy);font-size:13px;font-weight:700;margin:8px 0 4px;}
  .doc ul{margin:4px 0;padding-left:20px;font-size:13.5px;}
  .doc table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13.5px;}
  .doc table th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;}
  .doc table td{padding:8px 10px;border-bottom:1px solid #eee;}
  .doc table tr:nth-child(even) td{background:#F4F7FC;}
  .doc .tot td{background:var(--navy) !important;color:#fff;font-weight:700;}
  .doc .obs{font-size:12.5px;font-style:italic;color:#555;margin-top:14px;}
  .doc .sign{text-align:center;margin-top:14px;font-size:12px;border-top:1px solid #ccc;padding-top:6px;}
  .doc-autoriza{margin-top:10px;padding-top:6px;border-top:2px dashed #555;color:#222;page-break-inside:avoid;break-inside:avoid;}
  .doc-autoriza .corte{font-size:11px;color:#555;text-align:center;letter-spacing:1px;margin:-19px auto 10px;background:#fff;width:150px;}
  .doc-autoriza .aut-titulo{text-align:center;font-weight:700;font-size:14px;color:var(--navy);margin-bottom:8px;}
  .doc-autoriza p{font-size:12px;line-height:1.25;margin:4px 0 8px;text-align:justify;}
  .doc-autoriza .aut-linhas{display:grid;grid-template-columns:1fr 2fr;gap:12px;font-size:11px;color:#444;margin-top:12px;}
  .doc-autoriza .aut-linhas div{border-top:1px solid #555;padding-top:4px;text-align:center;}
  .doc-footer{text-align:center;font-size:11px;color:#888;margin-top:24px;border-top:1px solid #ddd;padding-top:8px;}
  .status-pill{display:inline-block;padding:4px 12px;border-radius:20px;font-weight:700;font-size:12px;margin-left:8px;vertical-align:middle;}
  select.status-select{max-width:220px;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
  .muted-small{color:var(--muted);font-size:12.5px;margin-top:4px;}
  .client-suggest{border:1px solid var(--border);border-radius:8px;margin-top:4px;max-height:150px;overflow:auto;background:var(--card);position:relative;}
  .client-suggest div{padding:8px 10px;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--border);}
  .client-suggest div:last-child{border-bottom:none;}
  .client-suggest div:hover{background:var(--light);}
  .preset-row{display:flex;gap:8px;align-items:center;margin-top:6px;}
  .preset-row select{flex:1;}
  .preset-manage-list{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:10px;max-height:260px;overflow-y:auto;}
  .preset-manage-row{display:grid;grid-template-columns:1fr 90px 34px 34px;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);align-items:center;font-size:13.5px;}
  .preset-manage-row.noval{grid-template-columns:1fr 34px;}
  .preset-manage-row:last-child{border-bottom:none;}
  .preset-add-row{display:grid;grid-template-columns:1fr 100px auto;gap:8px;padding:12px;border-top:1px solid var(--border);align-items:center;}
  .preset-add-row.noval{grid-template-columns:1fr auto;}
  .preset-add-row input{margin:0;}
  .modal-tabs{display:flex;gap:6px;padding:12px 18px 0;}
  .modal-tabs button{border:none;background:var(--light);color:var(--muted);padding:7px 14px;border-radius:8px 8px 0 0;font-weight:700;font-size:13px;cursor:pointer;}
  .modal-tabs button.active{background:var(--navy);color:#fff;}
  .btn-config-gear{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;margin-left:6px;padding:0;vertical-align:middle;}
  .config-row{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border);font-size:14px;}
  .config-row:last-child{border-bottom:none;}
  .switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:24px;transition:.15s;}
  .switch .slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.15s;}
  .switch input:checked + .slider{background:var(--blue);}
  .switch input:checked + .slider:before{transform:translateX(18px);}
  .lock-overlay{position:fixed;inset:0;background:var(--navy,#10243e);display:flex;align-items:center;justify-content:center;z-index:9999;}
  .lock-card{background:var(--card,#fff);padding:32px 28px;border-radius:14px;width:100%;max-width:320px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35);margin:16px;}
  .lock-card input{width:100%;margin-top:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px;box-sizing:border-box;}
  @media print{
    body *{visibility:hidden;}
    .doc,.doc *{visibility:visible;}
    .doc{position:absolute;top:0;left:0;width:100%;padding:0 20px;}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="lockOverlay" class="lock-overlay">
  <div class="lock-card">
    <img id="lockLogo" src="" alt="MTZ" style="height:40px;margin-bottom:14px;">
    <h3 style="margin:0 0 4px;">Acesso ao sistema</h3>
    <p id="lockSubtitle" class="muted-small">Entre com seu e-mail e senha</p>
    <input type="email" id="lockEmailInput" placeholder="E-mail" autocomplete="username" style="width:100%;margin-bottom:8px;">
    <input type="password" id="lockPassInput" placeholder="Senha" autocomplete="current-password">
    <button class="btn btn-primary" id="lockSubmitBtn" style="width:100%;margin-top:10px;">Entrar</button>
    <button class="btn btn-outline btn-sm" id="lockResetBtn" type="button" style="width:100%;margin-top:8px;">Esqueci minha senha</button>
    <div id="lockMsg" class="muted-small" style="color:#c0392b;margin-top:8px;min-height:16px;"></div>
  </div>
</div>
<div class="wrap">
  <header class="top">
    <img id="logoHeader" src="" alt="MTZ Soluções em Tecnologia">
    <nav class="tabs">
      <button data-tab="novo" class="active">Novo</button>
      <button data-tab="historico">Histórico</button>
      <button data-tab="clientes">Clientes</button>
    </nav>
    <button id="logoutBtn" class="btn btn-outline btn-sm" style="margin-left:10px;">Sair</button>
  </header>
  <div class="muted-small" style="text-align:center;margin:-10px 0 14px;">Versão MTZOS — CEP automático via ViaCEP • banco compartilhado em tempo real (Firebase)</div>

  <div id="tab-novo">
    <div class="card">
      <h2 id="formTitle">Nova Ordem de Serviço / Orçamento</h2>

      <label>Cliente já cadastrado</label>
      <select id="cliSalvoSelect"><option value="">+ Inserir cliente salvo...</option></select>

      <label>Cliente (nome)</label>
      <input type="text" id="fCliNome" placeholder="Nome do cliente" autocomplete="off">
      <div id="cliSuggest"></div>

      <div class="row">
        <div>
          <label>Telefone</label>
          <input type="tel" id="fCliTel" placeholder="(11) 90000-0000">
        </div>
        <div>
          <label>CEP</label>
          <input type="text" id="fCliCep" placeholder="00000-000" inputmode="numeric" maxlength="9">
        </div>
      </div>

      <div class="rowEnd">
        <div>
          <label>Endereço (rua)</label>
          <input type="text" id="fCliEnd" placeholder="Rua, avenida...">
        </div>
        <div>
          <label>Número</label>
          <input type="text" id="fCliNumero" placeholder="Nº" maxlength="10">
        </div>
      </div>
      <div class="rowCid">
        <div>
          <label>Bairro</label>
          <input type="text" id="fCliBairro" placeholder="Bairro">
        </div>
        <div>
          <label>Cidade</label>
          <input type="text" id="fCliCidade" placeholder="Cidade">
        </div>
        <div>
          <label>Estado</label>
          <select id="fCliUf"><option value="">UF</option><option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option><option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option><option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option><option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option><option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option><option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option><option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option><option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option><option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option></select>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Documento do cliente
            <button type="button" id="configCamposBtn" class="btn-config-gear" title="Configurar campos obrigatórios">⚙</button>
          </label>
          <div style="display:flex; gap:8px;">
            <select id="fCliDocTipo" style="max-width:100px;">
              <option value="CPF">CPF</option>
              <option value="RG">RG</option>
            </select>
            <input type="text" id="fCliDocNumero" placeholder="000.000.000-00" style="flex:1;">
          </div>
        </div>
        <div></div>
      </div>

      <div class="row">
        <div>
          <label>Data</label>
          <input type="date" id="fData">
        </div>
        <div>
          <label>Status</label>
          <select id="fStatus">
            <option value="orcamento">Orçamento (proposta)</option>
            <option value="aprovado">Aprovado — em execução</option>
            <option value="concluido">Concluído</option>
            <option value="recusado">Recusado</option>
          </select>
        </div>
      </div>

      <label>Equipamento / Modelo</label>
      <input type="text" id="fEquip" placeholder="Ex.: Impressora Epson L495">
      <div class="preset-row">
        <select id="equipPresetSelect"><option value="">+ Inserir equipamento padrão...</option></select>
        <button class="btn btn-outline btn-sm" id="gerenciarEquip" type="button">Gerenciar</button>
      </div>

      <label>Problema relatado</label>
      <textarea id="fProblema" placeholder="Descreva o problema relatado pelo cliente"></textarea>

      <label>Serviço executado / a executar (uma linha por item)</label>
      <textarea id="fServicos" placeholder="Ex.: Diagnóstico técnico e reset do contador de manutenção"></textarea>
      <div class="preset-row">
        <select id="servicoPresetSelect"><option value="">+ Inserir serviço padrão...</option></select>
        <button class="btn btn-outline btn-sm" id="gerenciarServicos" type="button">Gerenciar</button>
      </div>

      <label>Itens de valor</label>
      <div class="itens-list" id="itensList"></div>
      <button class="btn btn-outline btn-sm" id="addItem" style="margin-top:8px;">+ Adicionar item</button>
      <div class="preset-row">
        <select id="pecaPresetSelect"><option value="">+ Inserir peça padrão...</option></select>
        <button class="btn btn-outline btn-sm" id="gerenciarPecas" type="button">Gerenciar</button>
      </div>

      <div class="total-box"><span>TOTAL</span><span id="totalDisplay">R$ 0,00</span></div>

      <label>Entrada / sinal na aprovação (R$)</label>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <input type="number" id="fEntrada" step="0.01" min="0" placeholder="0,00" style="max-width:150px;">
        <button class="btn btn-outline btn-sm" type="button" data-pct="30">30%</button>
        <button class="btn btn-outline btn-sm" type="button" data-pct="50">50%</button>
        <button class="btn btn-outline btn-sm" type="button" data-pct="100">100%</button>
        <label style="display:flex;gap:6px;align-items:center;margin:0;text-transform:none;font-size:13px;letter-spacing:0;">
          <input type="checkbox" id="fEntradaPaga" style="width:auto;"> Entrada já recebida
        </label>
      </div>
      <div id="saldoDisplay" class="muted-small" style="margin-top:6px;"></div>

      <label>Observações</label>
      <textarea id="fObs" placeholder="Ex.: Orçamento válido por 15 dias a partir da data de emissão."></textarea>

      <div class="actions">
        <button class="btn btn-primary" id="salvarBtn">Salvar</button>
        <button class="btn btn-outline" id="limparBtn">Limpar formulário</button>
      </div>
      <div class="muted-small" id="saveStatus"></div>
    </div>
  </div>

  <div id="tab-historico" style="display:none;">
    <div class="card">
      <h2>Histórico</h2>
<div id="dashboardHistorico" style="margin:12px 0;"></div>
      <input type="text" class="search" id="searchHist" placeholder="Buscar por cliente, número ou equipamento...">
      <div id="histTableWrap"></div>
    </div>
  </div>

  <div id="tab-clientes" style="display:none;">
    <div class="card">
      <h2>Clientes</h2>
      <input type="text" class="search" id="searchCli" placeholder="Buscar cliente...">
      <div id="cliTableWrap"></div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>

function fmtMoney(v){
  return "R$ " + (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  return d+"/"+m+"/"+y;
}
function toast(msg){

// ---------- Itens de valor ----------
function addItemRow(desc, valor){
  const wrap = document.getElementById('itensList');
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `
    <input type="text" placeholder="Descrição do item" class="itDesc" value="${desc?desc.replace(/"/g,'&quot;'):''}">
    <input type="number" placeholder="0,00" step="0.01" class="itValor" value="${valor!==undefined?valor:''}">
    <button class="icon-btn" title="Remover">✕</button>
  `;
  row.querySelector('.icon-btn').addEventListener('click', ()=>{ row.remove(); recalcTotal(); });
  row.querySelector('.itValor').addEventListener('input', recalcTotal);
  wrap.appendChild(row);
}
document.getElementById('addItem').addEventListener('click', ()=> addItemRow('', ''));
function recalcTotal(){
  let total = 0;
  document.querySelectorAll('.itValor').forEach(inp=>{ total += Number(inp.value)||0; });
  document.getElementById('totalDisplay').textContent = fmtMoney(total);
  const entrada = Number(document.getElementById('fEntrada').value)||0;
  const sd = document.getElementById('saldoDisplay');
  if(entrada > 0){
    const pct = total > 0 ? Math.round(entrada/total*100) : 0;
    sd.textContent = 'Entrada de ' + fmtMoney(entrada) + (total>0 ? ' ('+pct+'% do total)' : '') + ' — saldo na entrega: ' + fmtMoney(Math.max(total-entrada,0));
  } else {
    sd.textContent = '';
  }
  return total;
}
document.getElementById('fEntrada').addEventListener('input', recalcTotal);
document.querySelectorAll('[data-pct]').forEach(b=>{
  b.addEventListener('click', ()=>{
    const total = recalcTotal();
    document.getElementById('fEntrada').value = (Math.round(total*Number(b.dataset.pct))/100).toFixed(2);
    recalcTotal();
  });
});
function coletarItens(){
  const itens = [];
  document.querySelectorAll('.item-row').forEach(row=>{
    const desc = row.querySelector('.itDesc').value.trim();
    const valor = Number(row.querySelector('.itValor').value)||0;
    if(desc || valor) itens.push({descricao: desc, valor: valor});
  });
  return itens;
}

async function seedPresetsSeNecessario(){
  if(!db) return;
  try{
    const snapS = await db.collection('presetsServicos').get();
    if(!snapS.docs || !snapS.docs.length){
      for(const it of PRESETS_SERVICOS_PADRAO){
        await db.doc('presetsServicos/'+uid()).set({descricao: it.descricao, valor: it.valor, criadoEm: Date.now()});
      }
    }
  }catch(e){}
  try{
    const snapP = await db.collection('presetsPecas').get();
    if(!snapP.docs || !snapP.docs.length){
      for(const it of PRESETS_PECAS_PADRAO.concat(PRESETS_PECAS_EXTRA)){
        await db.doc('presetsPecas/'+uid()).set({descricao: it.descricao, valor: it.valor, criadoEm: Date.now()});
      }
    }
  }catch(e){}
  try{
    const snapE = await db.collection('presetsEquipamentos').get();
    if(!snapE.docs || !snapE.docs.length){
      for(const d of PRESETS_EQUIPAMENTOS_PADRAO){
        await db.doc('presetsEquipamentos/'+uid()).set({descricao: d, criadoEm: Date.now()});
      }
    }
  }catch(e){}
  await migrarPresetsComValor();
}

// Uma única vez: completa a lista com os padrões sugeridos e preenche o valor médio
// dos itens antigos que estavam sem preço. Depois disso, o que você editar ou apagar não é refeito.
async function migrarPresetsComValor(){
  try{
    const flag = await db.doc('config/presetsMigracao').get();
    const v = flag.exists && flag.data() ? (flag.data().v||0) : 0;
    if(v >= 3) return;
    const norm = t => (t||'').toLowerCase().replace(/\s+/g,' ').trim();
    if(v < 2){
      const grupos = [
        ['presetsServicos', PRESETS_SERVICOS_PADRAO],
        ['presetsPecas', PRESETS_PECAS_PADRAO]
      ];
      for(const [col, sugeridos] of grupos){
        const snap = await db.collection(col).get();
        const existentes = snap.docs.map(d=>({id:d.id, ...d.data()}));
        for(const it of sugeridos){
          const ex = existentes.find(p => norm(p.descricao) === norm(it.descricao));
          if(!ex){
            await db.doc(col+'/'+uid()).set({descricao: it.descricao, valor: it.valor, criadoEm: Date.now()});
          } else if(!(ex.valor > 0)){
            await db.doc(col+'/'+ex.id).update({valor: it.valor});
          }
        }
      }
    }
    // v3: peças e equipamentos adicionais
    const snapP = await db.collection('presetsPecas').get();
    const pecas = snapP.docs.map(d=>d.data());
    for(const it of PRESETS_PECAS_EXTRA){
      if(!pecas.some(p => norm(p.descricao) === norm(it.descricao))){
        await db.doc('presetsPecas/'+uid()).set({descricao: it.descricao, valor: it.valor, criadoEm: Date.now()});
      }
    }
    await db.doc('config/presetsMigracao').set({v: 3, em: Date.now()});
  }catch(e){}
}

// ---------- Máscaras: CEP e CPF ----------
function maskCep(v){
  v = (v||'').replace(/\D/g,'').slice(0,8);
  if(v.length > 5) v = v.slice(0,5)+'-'+v.slice(5);
  return v;
}
function maskCpf(v){
  v = (v||'').replace(/\D/g,'').slice(0,11);
  v = v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  return v;
}
function montarEndereco(rua, numero, bairro, cidade, uf){
  let a = (rua||'').trim();
  if(numero) a += (a ? ', ' : '') + numero;
  const loc = [cidade, uf].filter(Boolean).join(' — ');
  return [a, bairro, loc].filter(Boolean).join(', ');
}
document.getElementById('fCliCep').addEventListener('input', async (e)=>{
  e.target.value = maskCep(e.target.value);
  const digits = e.target.value.replace(/\D/g,'');
  if(digits.length===8){
    try{
      const resp = await fetch('https://viacep.com.br/ws/'+digits+'/json/');
      const j = await resp.json();
      if(!j.erro){
        if(j.logradouro) document.getElementById('fCliEnd').value = j.logradouro;
        if(j.bairro) document.getElementById('fCliBairro').value = j.bairro;
        if(j.localidade) document.getElementById('fCliCidade').value = j.localidade;
        if(j.uf) document.getElementById('fCliUf').value = j.uf;
        document.getElementById('fCliNumero').focus();
      } else {
        toast('CEP não encontrado');
      }
    }catch(err){
      toast('Não foi possível consultar o CEP agora (sem internet?)');
    }
  }
});
document.getElementById('fCliDocTipo').addEventListener('change', (e)=>{
  const numEl = document.getElementById('fCliDocNumero');
  numEl.placeholder = e.target.value==='CPF' ? '000.000.000-00' : 'Número do RG';
  numEl.value = '';
});
document.getElementById('fCliDocNumero').addEventListener('input', (e)=>{
  if(document.getElementById('fCliDocTipo').value === 'CPF'){
    e.target.value = maskCpf(e.target.value);
  }
});

// ---------- Configuração de campos obrigatórios ----------
function abrirConfigCampos(){
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
  <div class="modal-bg" id="modalBgConfig">
    <div class="modal" style="max-width:460px;">
      <div class="modal-head">
        <div><strong>Campos obrigatórios</strong></div>
        <button class="close-x" id="closeModalConfig">✕</button>
      </div>
      <div class="modal-body">
        <div class="config-row">
          <span>CEP obrigatório</span>
          <label class="switch"><input type="checkbox" id="cfgCep" ${configCampos.cepObrigatorio?'checked':''}><span class="slider"></span></label>
        </div>
        <div class="config-row">
          <span>CPF/RG obrigatório</span>
          <label class="switch"><input type="checkbox" id="cfgDoc" ${configCampos.documentoObrigatorio?'checked':''}><span class="slider"></span></label>
        </div>
        <div class="config-row">
          <span>Senha de acesso</span>
          <button class="btn btn-outline btn-sm" id="cfgTrocarSenha">Alterar senha</button>
        </div>
        <div class="config-row">
          <span>Dados da empresa</span>
          <button class="btn btn-outline btn-sm" id="cfgEditarEmpresa">Editar</button>
        </div>
      </div>
    </div>
  </div>`;
  document.getElementById('closeModalConfig').addEventListener('click', ()=> modalRoot.innerHTML='');
  document.getElementById('modalBgConfig').addEventListener('click', (e)=>{ if(e.target.id==='modalBgConfig') modalRoot.innerHTML=''; });
  const salvarConfig = async ()=>{
    if(!db) { toast('Sem conexão com o armazenamento agora.'); return; }
    const novo = {
      cepObrigatorio: document.getElementById('cfgCep').checked,
      documentoObrigatorio: document.getElementById('cfgDoc').checked
    };
    try{
      await db.doc('config/campos').set(novo);
      toast('Configuração salva');
    }catch(e){ toast('Erro ao salvar configuração'); }
  };
  document.getElementById('cfgCep').addEventListener('change', salvarConfig);
  document.getElementById('cfgDoc').addEventListener('change', salvarConfig);
  document.getElementById('cfgTrocarSenha').addEventListener('click', async ()=>{
    const user = auth && auth.currentUser;
    if(!user || !user.email){ toast('Faça login novamente.'); return; }
    const atual = prompt('Digite a senha atual:');
    if(atual===null) return;
    try{
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, atual);
      await user.reauthenticateWithCredential(cred);
      const nova = prompt('Digite a nova senha (mínimo 6 caracteres):');
      if(!nova || nova.length<6){ toast('Senha inválida (mínimo 6 caracteres)'); return; }
      const confirmarNova = prompt('Confirme a nova senha:');
      if(nova !== confirmarNova){ toast('As senhas não coincidem'); return; }
      await user.updatePassword(nova);
      toast('Senha alterada com sucesso');
    }catch(e){
      toast((e.code==='auth/invalid-credential'||e.code==='auth/wrong-password') ? 'Senha atual incorreta' : 'Erro ao alterar a senha');
    }
  });
  document.getElementById('cfgEditarEmpresa').addEventListener('click', async ()=>{
    if(!db){ toast('Sem conexão com o armazenamento agora.'); return; }
    try{
      const doc = await db.doc('config/acesso').get();
      const hashMasterSalvo = doc.exists && doc.data() ? doc.data().senhaMasterHash : null;
      if(!hashMasterSalvo){
        const nova = prompt('Nenhuma senha master definida ainda.\nCrie uma senha master (mínimo 4 caracteres) para proteger os dados da empresa:');
        if(!nova || nova.length<4){ if(nova!==null) toast('Senha inválida'); return; }
        const confirmar = prompt('Confirme a senha master:');
        if(nova !== confirmar){ toast('As senhas não coincidem'); return; }
        const novoHash = await sha256Hex(nova);
        await db.doc('config/acesso').set({senhaMasterHash: novoHash}, {merge:true});
        toast('Senha master definida');
      } else {
        const digitada = prompt('Digite a senha master para editar os dados da empresa:');
        if(digitada===null) return;
        const hashDigitado = await sha256Hex(digitada);
        if(hashDigitado !== hashMasterSalvo){ toast('Senha master incorreta'); return; }
      }
      abrirEditarEmpresa();
    }catch(e){ toast('Erro ao verificar a senha master'); }
  });
}

function preencherCliente(c){
  document.getElementById('fCliNome').value = c.nome||'';
  document.getElementById('fCliTel').value = c.telefone||'';
  document.getElementById('fCliEnd').value = c.endereco||'';
  document.getElementById('fCliNumero').value = c.numero||'';
  document.getElementById('fCliBairro').value = c.bairro||'';
  document.getElementById('fCliCidade').value = c.cidade||'';
  document.getElementById('fCliUf').value = c.uf||'';
  document.getElementById('fCliCep').value = c.cep||'';
  document.getElementById('fCliDocTipo').value = c.documentoTipo||'CPF';
  document.getElementById('fCliDocNumero').value = c.documentoNumero||'';
}
function renderClienteSelect(){
  const sel = document.getElementById('cliSalvoSelect');
  const lista = [...clientes].sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  sel.innerHTML = '<option value="">+ Inserir cliente salvo' + (lista.length ? ' ('+lista.length+')' : '') + '...</option>' +
    lista.map(c=>`<option value="${c.id}">${(c.nome||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}${c.telefone?' · '+c.telefone:''}</option>`).join('');
  sel.value = '';
}
document.getElementById('cliSalvoSelect').addEventListener('change', (e)=>{
  const c = clientes.find(x=>x.id===e.target.value);
  if(c){
    preencherCliente(c);
    document.getElementById('cliSuggest').innerHTML = '';
    toast('Cliente inserido');
  }
  e.target.value = '';
});
document.getElementById('fCliNome').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  const box = document.getElementById('cliSuggest');
  box.innerHTML = '';
  if(!q){ return; }
  const matches = clientes.filter(c => (c.nome||'').toLowerCase().includes(q)).slice(0,5);
  if(!matches.length) return;
  const suggestDiv = document.createElement('div');
  suggestDiv.className = 'client-suggest';
  matches.forEach(c=>{
    const item = document.createElement('div');
    item.textContent = c.nome + (c.telefone? ' · '+c.telefone : '');
    item.addEventListener('click', ()=>{
      preencherCliente(c);
      box.innerHTML = '';
    });
    suggestDiv.appendChild(item);
  });
  box.appendChild(suggestDiv);
});

// ---------- Salvar ----------
document.getElementById('salvarBtn').addEventListener('click', async ()=>{
  const nome = document.getElementById('fCliNome').value.trim();
  if(!nome){ toast('Informe o nome do cliente'); return; }
  const cep = document.getElementById('fCliCep').value.trim();
  const docTipo = document.getElementById('fCliDocTipo').value;
  const docNumero = document.getElementById('fCliDocNumero').value.trim();
  if(configCampos.cepObrigatorio && !cep){ toast('CEP é obrigatório'); return; }
  if(configCampos.documentoObrigatorio && !docNumero){ toast(docTipo+' é obrigatório'); return; }
  const itens = coletarItens();
  const total = itens.reduce((s,i)=>s+(Number(i.valor)||0),0);
  const entradaVal = Number(document.getElementById('fEntrada').value)||0;
  if(entradaVal > total){ toast('A entrada não pode ser maior que o total'); return; }
  const servicos = document.getElementById('fServicos').value.split('\n').map(s=>s.trim()).filter(Boolean);

  const data = {
    clienteNome: nome,
    clienteTelefone: document.getElementById('fCliTel').value.trim(),
    clienteEndereco: document.getElementById('fCliEnd').value.trim(),
    clienteNumero: document.getElementById('fCliNumero').value.trim(),
    clienteBairro: document.getElementById('fCliBairro').value.trim(),
    clienteCidade: document.getElementById('fCliCidade').value.trim(),
    clienteUf: document.getElementById('fCliUf').value,
    clienteCep: cep,
    clienteDocTipo: docTipo,
    clienteDocNumero: docNumero,
    data: document.getElementById('fData').value,
    status: document.getElementById('fStatus').value,
    equipamento: document.getElementById('fEquip').value.trim(),
    problema: document.getElementById('fProblema').value.trim(),
    servicos: servicos,
    itens: itens,
    total: total,
    observacoes: document.getElementById('fObs').value.trim(),
    entrada: Number(document.getElementById('fEntrada').value)||0,
    entradaPaga: document.getElementById('fEntradaPaga').checked,
    atualizadoEm: Date.now()
  };

  if(!db){ toast('Sem conexão com o armazenamento agora.'); return; }

  try{
    await upsertCliente(data.clienteNome, data.clienteTelefone, data.clienteEndereco, data.clienteCep, data.clienteDocTipo, data.clienteDocNumero, {numero:data.clienteNumero, bairro:data.clienteBairro, cidade:data.clienteCidade, uf:data.clienteUf});

    if(editingId){
      await db.doc('ordens/'+editingId).update(data);
      toast('Atualizado com sucesso');
    } else {
      const numero = await proximoNumero();
      data.numero = numero;
      data.criadoEm = Date.now();
      const id = uid();
      await db.doc('ordens/'+id).set(data);
      toast('Salvo como #' + numero);
    }
    limparForm();
  }catch(err){
    toast('Erro ao salvar');
  }
});

async function proximoNumero(){
  try{
    const counterRef = db.doc('meta/contador');
    const cur = await counterRef.get();
    const curVal = (cur && cur.exists && cur.data() && cur.data().valor) || 0;
    const maiorExistente = ordens.reduce((m,o)=> Math.max(m, Number(o.numero)||0), 0);
    const next = Math.max(curVal, maiorExistente) + 1;
    await counterRef.set({valor: next});
    return next;
  }catch(e){
    return (ordens.reduce((m,o)=> Math.max(m, Number(o.numero)||0), 0)) + 1;
  }
}

async function upsertCliente(nome, telefone, endereco, cep, documentoTipo, documentoNumero, extra){
  extra = extra || {};
  if(!nome) return;
  const existing = clientes.find(c => (c.nome||'').toLowerCase() === nome.toLowerCase());
  if(existing){
    if(telefone || endereco || cep || documentoNumero || extra.numero || extra.cidade){
      await db.doc('clientes/'+existing.id).update({
        telefone: telefone || existing.telefone || '',
        endereco: endereco || existing.endereco || '',
        numero: extra.numero || existing.numero || '',
        bairro: extra.bairro || existing.bairro || '',
        cidade: extra.cidade || existing.cidade || '',
        uf: extra.uf || existing.uf || '',
        cep: cep || existing.cep || '',
        documentoTipo: documentoTipo || existing.documentoTipo || 'CPF',
        documentoNumero: documentoNumero || existing.documentoNumero || ''
      });
    }
  } else {
    const id = uid();
    await db.doc('clientes/'+id).set({nome, telefone: telefone||'', endereco: endereco||'', numero: extra.numero||'', bairro: extra.bairro||'', cidade: extra.cidade||'', uf: extra.uf||'', cep: cep||'', documentoTipo: documentoTipo||'CPF', documentoNumero: documentoNumero||'', criadoEm: Date.now()});
  }
}

// ---------- Histórico ----------
function statusBadge(status){
  const map = {
    orcamento: ['Orçamento','badge-orc'],
    aprovado: ['Aprovado','badge-aprov'],
    concluido: ['Concluído','badge-concl'],
    recusado: ['Recusado','badge-recus']
  };
  const [label, cls] = map[status] || [' — ',''];
  return `<span class="badge ${cls}">${label}</span>`;
}

function renderHistorico(){
  const wrap = document.getElementById('histTableWrap');
  const q = (document.getElementById('searchHist').value||'').toLowerCase();
  let list = [...ordens].sort((a,b)=> (b.numero||0)-(a.numero||0));
  if(q){
    list = list.filter(o =>
      (o.clienteNome||'').toLowerCase().includes(q) ||
      String(o.numero||'').includes(q) ||
      (o.equipamento||'').toLowerCase().includes(q) ||
      (o.status||'').toLowerCase().includes(q) ||
      (o.clienteDocNumero||'').toLowerCase().includes(q) ||
      (o.clienteTelefone||'').toLowerCase().includes(q)
    );
  }
  if(!list.length){
    wrap.innerHTML = '<div class="empty">Nenhum registro encontrado.</div>';
    return;
  }
  let html = '<table class="hist"><thead><tr><th>#</th><th>Cliente</th><th>Equipamento</th><th>Data</th><th>Status</th><th>Total</th></tr></thead><tbody>';
  list.forEach(o=>{
    html += `<tr data-id="${o.id}">
      <td>${o.numero||'-'}</td>
      <td>${o.clienteNome||''}</td>
      <td>${o.equipamento||''}</td>
      <td>${fmtDate(o.data)}</td>
      <td>${statusBadge(o.status)}</td>
      <td>${fmtMoney(o.total)}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
  wrap.querySelectorAll('tr[data-id]').forEach(tr=>{
    tr.addEventListener('click', ()=> abrirDetalhe(tr.dataset.id));
  });
}
document.getElementById('searchHist').addEventListener('input', renderHistorico);

// ---------- Clientes ----------
function renderClientes(){
  const wrap = document.getElementById('cliTableWrap');
  const q = (document.getElementById('searchCli').value||'').toLowerCase();
  let list = [...clientes].sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  if(q) list = list.filter(c => (c.nome||'').toLowerCase().includes(q));
  if(!list.length){
    wrap.innerHTML = '<div class="empty">Nenhum cliente cadastrado ainda.</div>';
    return;
  }
  let html = '<table class="hist"><thead><tr><th>Nome</th><th>Telefone</th><th>Endereço</th><th>Serviços</th></tr></thead><tbody>';
  list.forEach(c=>{
    const count = ordens.filter(o => (o.clienteNome||'').toLowerCase() === (c.nome||'').toLowerCase()).length;
    html += `<tr data-nome="${c.nome.replace(/"/g,'&quot;')}"><td>${c.nome}</td><td>${c.telefone||' — '}</td><td>${montarEndereco(c.endereco,c.numero,c.bairro,c.cidade,c.uf)||' — '}</td><td>${count}</td></tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
  wrap.querySelectorAll('tr[data-nome]').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      document.getElementById('searchHist').value = tr.dataset.nome;
      document.querySelector('[data-tab="historico"]').click();
    });
  });
}
document.getElementById('searchCli').addEventListener('input', renderClientes);

async function gerarPdf(o){
  const btn = document.getElementById('printBtn');
  const original = btn.textContent;
  const el = document.getElementById('docPrint');
  if(!el || typeof html2pdf === 'undefined'){
    window.print();
    return;
  }
  btn.textContent = 'Gerando...';
  btn.disabled = true;
  const nomeArq = `OS_${String(o.numero).padStart(4,'0')}_${(o.clienteNome||'cliente').replace(/[^\w\-]+/g,'_')}.pdf`;
  try{
    await html2pdf().set({
      margin: 10,
      filename: nomeArq,
      image: {type:'jpeg', quality:0.98},
      html2canvas: {scale:2, useCORS:true, backgroundColor:'#ffffff'},
      jsPDF: {unit:'mm', format:'a4', orientation:'portrait'},
      pagebreak: {mode:['css','legacy'], avoid:['.doc-autoriza']}
    }).from(el).save();
    toast('PDF gerado');
  }catch(err){
    toast('Não foi possível gerar o PDF. Tentando impressão do navegador...');
    window.print();
  }finally{
    btn.textContent = original;
    btn.disabled = false;
  }
}

async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function mostrarOverlay(){ document.getElementById('lockOverlay').style.display='flex'; }
function esconderOverlay(){ document.getElementById('lockOverlay').style.display='none'; }

let dbIniciado = false;
function liberarAcesso(){
  esconderOverlay();
  if(dbIniciado) return;
  dbIniciado = true;
  limparForm();
  initDb();
}

function msgErroAuth(e){
  switch(e && e.code){
    case 'auth/invalid-email': return 'E-mail inválido.';
    case 'auth/user-disabled': return 'Este usuário está desativado.';
    case 'auth/user-not-found':
    case 'auth/wrong-password':
    case 'auth/invalid-credential': return 'E-mail ou senha incorretos.';
    case 'auth/too-many-requests': return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
    case 'auth/network-request-failed': return 'Sem conexão com a internet.';
    default: return 'Não foi possível entrar. Tente novamente.';
  }
}

function iniciarComSenha(){
  if(!firebaseReady){
    document.getElementById('lockMsg').textContent = 'Não foi possível conectar (verifique sua internet).';
    mostrarOverlay();
    return;
  }
  mostrarOverlay();
  auth.onAuthStateChanged(user=>{
    if(user){ liberarAcesso(); }
    else { dbIniciado = false; mostrarOverlay(); }
  });
}

async function tentarAcesso(){
  const email = document.getElementById('lockEmailInput').value.trim();
  const senha = document.getElementById('lockPassInput').value;
  const msgEl = document.getElementById('lockMsg');
  msgEl.style.color = '#c0392b';
  msgEl.textContent = '';
  if(!email || !senha){ msgEl.textContent = 'Informe e-mail e senha.'; return; }
  const btn = document.getElementById('lockSubmitBtn');
  btn.disabled = true;
  try{
    await auth.signInWithEmailAndPassword(email, senha);
    document.getElementById('lockPassInput').value = '';
  }catch(e){
    msgEl.textContent = msgErroAuth(e);
  }finally{
    btn.disabled = false;
  }
}

async function esqueciSenha(){
  const email = document.getElementById('lockEmailInput').value.trim();
  const msgEl = document.getElementById('lockMsg');
  msgEl.style.color = '#c0392b';
  if(!email){ msgEl.textContent = 'Digite seu e-mail acima para receber o link.'; return; }
  try{
    await auth.sendPasswordResetEmail(email);
    msgEl.style.color = '#1E9E5A';
    msgEl.textContent = 'Se o e-mail estiver cadastrado, enviamos um link para redefinir a senha.';
  }catch(e){
    msgEl.textContent = msgErroAuth(e);
  }
}

document.getElementById('lockSubmitBtn').addEventListener('click', tentarAcesso);
document.getElementById('lockResetBtn').addEventListener('click', esqueciSenha);
document.getElementById('lockPassInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') tentarAcesso(); });
document.getElementById('lockEmailInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') tentarAcesso(); });
document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  try{ await auth.signOut(); }catch(e){}
  location.reload();
});

iniciarComSenha();
</script>
